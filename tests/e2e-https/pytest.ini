# verify=False in conftest is deliberate: Pebble generates a fresh issuance
# root on every start, so the chain cannot be pinned; the certificate itself is
# verified explicitly in test_https_presents_the_issued_certificate. Without
# this filter pytest re-enables the warning for every unverified request.
[pytest]
filterwarnings =
    ignore::urllib3.exceptions.InsecureRequestWarning
