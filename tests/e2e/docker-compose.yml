# E2E stack for the reverse-proxy. One proxy instance per configuration source
# (environment, file, mixed, basic-auth, live reload), all forwarding to the
# same shared backends, plus a pytest test-runner. The proxy routes by Host
# header (server_name), so the forward/redirect sources below are the Host
# values the tests send.

# Explicit project name so this stack never collides with other e2e stacks that
# also live in a directory called "e2e" (compose's default project name).
name: reverse-proxy-e2e

# Backend web servers: identical mwaeckerlin/nginx serving a per-host marker
# page. PHP_FPM_HOST points at the shared php-fpm so the default config loads
# (php-fpm itself is never exercised -- the marker index.html is served for /).
x-backend: &backend
  image: mwaeckerlin/nginx
  environment:
    ROOT: /app
    PHP_FPM_HOST: php-fpm
    PHP_FPM_PORT: "9000"
  depends_on:
    - php-fpm

# Every proxy is the same image; only its configuration source differs.
x-proxy: &proxy
  image: mwaeckerlin/reverse-proxy
  depends_on:
    - localserver
    - demo
    - test
    - doesnotrun
    - redirector
    - slow

# DH parameters are generated at start; a tiny key keeps these HTTP-only tests
# fast (they never terminate TLS, so the size is irrelevant here).
x-dhparam: &dhparam
  DHPARAM: "512"

services:

  # --- configuration via environment variables ---------------------------
  reverse-proxy:
    <<: *proxy
    build:
      context: ../..
    environment:
      <<: *dhparam
      # The invalid rules (bad{host, bad;redir) must be ignored with a warning;
      # after.invalid proves that the rules after them are still applied.
      FORWARD: |-
        localhost localserver:8080
        demo demo:8080
        test test:8080
        doesnotrun doesnotrun:8080
        pathhost/app localserver:8080
        plain plain:8080
        redirect-on redirector:8080
        redirect-off redirector:8080
        slow slow:8080
        bad{host localserver:8080
        after.invalid localserver:8080
      REDIRECT: |-
        extern example.com
        redirbase/old example.com
        bad;redir example.com
      # the backend's own redirects are rewritten to the public host, except
      # for the hosts listed here
      PROXY_REDIRECT_OFF: redirect-off

  # --- configuration via a mounted file only -----------------------------
  revproxy-file:
    <<: *proxy
    environment:
      <<: *dhparam
    volumes:
      - ./config:/config:ro

  # --- configuration via environment AND file (file wins on conflict) ----
  revproxy-mixed:
    <<: *proxy
    environment:
      <<: *dhparam
      FORWARD: |-
        mixedenv localserver:8080
        conflict localserver:8080
    volumes:
      - ./config-mixed:/config:ro

  # --- forward protected by basic-auth -----------------------------------
  revproxy-auth:
    <<: *proxy
    environment:
      <<: *dhparam
      FORWARD: |-
        secret localserver:8080
    volumes:
      - ./basic-auth:/etc/nginx/basic-auth:ro

  # --- the same with an own realm name -------------------------------------
  revproxy-auth-realm:
    <<: *proxy
    environment:
      <<: *dhparam
      BASIC_AUTH_REALM: Team Area
      FORWARD: |-
        secret localserver:8080
    volumes:
      - ./basic-auth:/etc/nginx/basic-auth:ro

  # --- a realm that tries to switch the protection off by closing the quote;
  #     it must be refused with a warning, the protection stays -------------
  revproxy-auth-badrealm:
    <<: *proxy
    environment:
      <<: *dhparam
      BASIC_AUTH_REALM: 'x"; auth_basic off; #'
      FORWARD: |-
        secret localserver:8080
    volumes:
      - ./basic-auth:/etc/nginx/basic-auth:ro

  # --- basic-auth from BASIC_AUTH and BASIC_AUTH_FILE (password secretpass
  #     for every user); the first entry tries to leave the directory and must
  #     be ignored, mixedauth also has a mounted htpasswd, which wins --------
  revproxy-auth-env:
    <<: *proxy
    environment:
      <<: *dhparam
      FORWARD: |-
        envsecret localserver:8080
        envsecret/admin localserver:8080
        filesecret localserver:8080
        mixedauth localserver:8080
      BASIC_AUTH: |-
        ../escape envuser:$$apr1$$Xy9pQ2mn$$pYU9MCeo8MzT0F8vO5u3Q/
        envsecret envuser:$$apr1$$Xy9pQ2mn$$pYU9MCeo8MzT0F8vO5u3Q/
        envsecret/admin adminuser:$$apr1$$Xy9pQ2mn$$pYU9MCeo8MzT0F8vO5u3Q/
        mixedauth envuser:$$apr1$$Xy9pQ2mn$$pYU9MCeo8MzT0F8vO5u3Q/
      BASIC_AUTH_FILE: /run/basic-auth
    configs:
      - source: basic-auth-file
        target: /run/basic-auth
      - source: mixedauth-htpasswd
        target: /etc/nginx/basic-auth/mixedauth.htpasswd

  # --- limits and timeouts from the environment; PROXY_SEND_TIMEOUT tries to
  #     inject a directive and must fall back to its default ----------------
  revproxy-limits:
    <<: *proxy
    environment:
      <<: *dhparam
      CLIENT_MAX_BODY_SIZE: 1k
      PROXY_READ_TIMEOUT: 1s
      PROXY_SEND_TIMEOUT: "5s; return 200 injected"
      FORWARD: |-
        localhost localserver:8080
        slow slow:8080

  # --- live reload: configuration file on a shared volume, written by the
  #     test-runner at runtime to prove the file watch reloads nginx --------
  revproxy-reload:
    <<: *proxy
    environment:
      <<: *dhparam
    volumes:
      - reloadcfg:/config

  # --- backends ----------------------------------------------------------
  localserver:
    <<: *backend
    volumes:
      - ./apps/localserver:/app:ro

  demo:
    <<: *backend
    volumes:
      - ./apps/demo:/app:ro

  test:
    <<: *backend
    volumes:
      - ./apps/test:/app:ro

  php-fpm:
    image: php:8-fpm-alpine

  # Barebones backend that sends no security headers of its own: proves the
  # proxy adds them (the mwaeckerlin/nginx backends already send their own).
  plain:
    image: python:3.12-slim
    command: ["python", "-m", "http.server", "8080"]
    working_dir: /srv

  # Backend that answers every request with a redirect to its own internal
  # address, the way an application behind a proxy often does.
  redirector:
    image: python:3.12-slim
    command:
      - python
      - -c
      - |
        import http.server
        class H(http.server.BaseHTTPRequestHandler):
            def do_GET(self):
                self.send_response(302)
                self.send_header('Location', 'http://redirector:8080/landed/')
                self.end_headers()
        http.server.HTTPServer(('', 8080), H).serve_forever()

  # Backend that answers after three seconds, longer than the read timeout of
  # revproxy-limits and shorter than the default.
  slow:
    image: python:3.12-slim
    command:
      - python
      - -c
      - |
        import http.server, time
        class H(http.server.BaseHTTPRequestHandler):
            def do_GET(self):
                time.sleep(3)
                body = b'SLOW-OK'
                self.send_response(200)
                self.send_header('Content-Length', str(len(body)))
                self.end_headers()
                self.wfile.write(body)
        http.server.ThreadingHTTPServer(('', 8080), H).serve_forever()

  # Just a dummy, not a web server: nothing listens, so the proxy answers with
  # its 502 maintenance page.
  doesnotrun:
    image: mwaeckerlin/very-base
    command: ["sleep", "infinity"]

  # --- test-runner (started explicitly via `compose run`, not by `up`) ----
  test-runner:
    build:
      context: .
    profiles:
      - runner
    depends_on:
      - reverse-proxy
      - revproxy-file
      - revproxy-mixed
      - revproxy-auth
      - revproxy-auth-realm
      - revproxy-auth-badrealm
      - revproxy-auth-env
      - revproxy-limits
      - revproxy-reload
    environment:
      REVPROXY_URL:   http://reverse-proxy:8080
      FILE_URL:       http://revproxy-file:8080
      MIXED_URL:      http://revproxy-mixed:8080
      AUTH_URL:       http://revproxy-auth:8080
      REALM_URL:      http://revproxy-auth-realm:8080
      BADREALM_URL:   http://revproxy-auth-badrealm:8080
      AUTH_ENV_URL:   http://revproxy-auth-env:8080
      LIMITS_URL:     http://revproxy-limits:8080
      RELOAD_URL:     http://revproxy-reload:8080
    volumes:
      - reloadcfg:/reload-config
    command: ["pytest", "-v", "--tb=short"]

volumes:
  reloadcfg:

configs:
  basic-auth-file:
    content: |
      filesecret fileuser:$$apr1$$Xy9pQ2mn$$pYU9MCeo8MzT0F8vO5u3Q/
  mixedauth-htpasswd:
    content: |
      authuser:$$apr1$$Xy9pQ2mn$$pYU9MCeo8MzT0F8vO5u3Q/
