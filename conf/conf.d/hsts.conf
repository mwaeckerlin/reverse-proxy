# HSTS only over HTTPS. Placing the header in proxy.conf (location level) is
# required because a location that sets any add_header stops inheriting the
# server-level ones, so proxied responses would otherwise lose HSTS. An empty
# value (plain HTTP) makes nginx omit the header.
map $scheme $hsts_header {
    https "max-age=15552000";
    default "";
}
