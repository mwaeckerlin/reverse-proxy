# Local demo stack. Rules are applied at container start (environment/file, see
# README) — no build arguments, no image rebuild to change the routing.
services:
  reverse-proxy:
    image: mwaeckerlin/reverse-proxy
    build:
      context: .
    ports:
      - 8080:8080
    environment:
      # Small DH parameters only to speed up this HTTP-only demo stack (no TLS
      # is terminated here); the production default is 4096.
      DHPARAM: "512"
      FORWARD: |-
        localhost localserver:8080
        demo demo:8080
        test test:8080
        doesnotrun doesnotrun:8080
      REDIRECT: |-
        extern example.com

  localserver:
    image: mwaeckerlin/nginx

  demo:
    image: mwaeckerlin/nginx

  test:
    image: mwaeckerlin/nginx

  # just a dummy, not a web server - produces maintenance page
  doesnotrun:
    image: mwaeckerlin/very-base
    command: ["sleep", "infinity"]
